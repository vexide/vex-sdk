[package]
name = "vex-sdk-pros"
description = "VEX SDK implementation using the PROS kernel's partner SDK for linkage."
repository = "https://github.com/vexide/vex-sdk/"
authors = ["Tropical"]
license = "MIT"
categories = ["science::robotics", "no-std", "embedded"]
keywords = ["vex", "vex-v5", "vex-robotics", "robotics"]
version = "0.1.0"
edition = "2021"
links = "pros"

[package.metadata.docs.rs]
targets = ["thumbv7a-vex-v5"]
cargo-args=[
    "-Zbuild-std=core,alloc,compiler_builtins",
    "-Zbuild-std-features=compiler-builtins-mem,panic-unwind"
]
